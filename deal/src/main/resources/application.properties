spring.application.name=deal

spring.datasource.url=${URL_DB}
spring.datasource.username=${USERNAME_DB}
spring.datasource.password=${PASSWORD_DB}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.liquibase.change-log= classpath:db/changelog/db.changelog-v1.xml

server.port=8081

spring.kafka.producer.bootstrap-servers=${KAFKA_SERVER}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=DEBUG
