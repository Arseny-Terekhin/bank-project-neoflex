openapi: 3.0.1
info:
  title: МС сделка
  description: Это API предоставляет эндпоинты для организации сделок
  contact:
    name: Арсений Терехин
    email: terexin-2003@mail.ru
  version: "1.0"
servers:
- description: Development
paths:
  /deal/statement:
    post:
      tags:
      - deal-controller
      operationId: createStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanStatementRequestDto"
            example:
              amount: 25000.00
              term: 12
              firstName: "Иван"
              lastName: "Иванов"
              middleName: "Иванович"
              email: "ivan.ivanov@example.com"
              birthdate: "1990-01-01"
              passportSeries: "1234"
              passportNumber: "567890"
        required: true
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanOfferDto"
  /deal/offer/select:
    post:
      tags:
      - deal-controller
      operationId: selectOffer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanOfferDto"
        required: true
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "200":
          description: OK
  /deal/document/{statementId}/sign:
    post:
      tags:
      - documents-controller
      operationId: sign
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "200":
          description: OK
  /deal/document/{statementId}/send:
    post:
      tags:
      - documents-controller
      operationId: send
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "200":
          description: OK
  /deal/document/{statementId}/code:
    post:
      tags:
      - documents-controller
      operationId: code
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "200":
          description: OK
  /deal/calculate/{statementId}:
    post:
      tags:
      - deal-controller
      operationId: calculate
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          minimum: 1
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishRegistrationRequestDto"
        required: true
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "200":
          description: OK
  /deal/admin/statement:
    get:
      tags:
      - admin-controller
      operationId: getAllStatement
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Statement"
  /deal/admin/statement/{statementId}:
    get:
      tags:
      - admin-controller
      operationId: getStatement
      parameters:
      - name: statementId
        in: path
        required: true
        schema:
          minimum: 1
          type: integer
          format: int64
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Statement"
components:
  schemas:
    ContentDisposition:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        filename:
          type: string
        charset:
          type: string
        size:
          type: integer
          format: int64
          deprecated: true
        creationDate:
          type: string
          format: date-time
          deprecated: true
        modificationDate:
          type: string
          format: date-time
          deprecated: true
        readDate:
          type: string
          format: date-time
          deprecated: true
        inline:
          type: boolean
        attachment:
          type: boolean
        formData:
          type: boolean
    HttpMethod:
      type: object
    HttpRange:
      type: object
    HttpStatusCode:
      type: object
      properties:
        error:
          type: boolean
        is5xxServerError:
          type: boolean
        is4xxClientError:
          type: boolean
        is3xxRedirection:
          type: boolean
        is1xxInformational:
          type: boolean
        is2xxSuccessful:
          type: boolean
    MediaType:
      type: object
      properties:
        type:
          type: string
        subtype:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        qualityValue:
          type: number
          format: double
        charset:
          type: string
        concrete:
          type: boolean
        wildcardType:
          type: boolean
        wildcardSubtype:
          type: boolean
        subtypeSuffix:
          type: string
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties:
            type: object
    SimpleErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        body:
          $ref: "#/components/schemas/ProblemDetail"
        statusCode:
          $ref: "#/components/schemas/HttpStatusCode"
        headers:
          type: object
          properties:
            contentType:
              $ref: "#/components/schemas/MediaType"
            origin:
              type: string
            empty:
              type: boolean
            location:
              type: string
              format: uri
            host:
              type: object
              properties:
                unresolved:
                  type: boolean
                hostString:
                  type: string
                address:
                  type: object
                  properties:
                    address:
                      type: string
                      format: byte
                    hostAddress:
                      type: string
                    linkLocalAddress:
                      type: boolean
                    hostName:
                      type: string
                    multicastAddress:
                      type: boolean
                    anyLocalAddress:
                      type: boolean
                    loopbackAddress:
                      type: boolean
                    siteLocalAddress:
                      type: boolean
                    mcglobal:
                      type: boolean
                    mcnodeLocal:
                      type: boolean
                    mclinkLocal:
                      type: boolean
                    mcsiteLocal:
                      type: boolean
                    mcorgLocal:
                      type: boolean
                    canonicalHostName:
                      type: string
                port:
                  type: integer
                  format: int32
                hostName:
                  type: string
            all:
              type: object
              additionalProperties:
                type: string
              writeOnly: true
            lastModified:
              type: integer
              format: int64
            date:
              type: integer
              format: int64
            contentLength:
              type: integer
              format: int64
            allow:
              uniqueItems: true
              type: array
              items:
                $ref: "#/components/schemas/HttpMethod"
            connection:
              type: array
              items:
                type: string
            ifModifiedSince:
              type: integer
              format: int64
            range:
              type: array
              items:
                $ref: "#/components/schemas/HttpRange"
            contentDisposition:
              $ref: "#/components/schemas/ContentDisposition"
            acceptCharset:
              type: array
              items:
                type: string
            cacheControl:
              type: string
            contentLanguage:
              type: object
              properties:
                language:
                  type: string
                displayName:
                  type: string
                country:
                  type: string
                variant:
                  type: string
                script:
                  type: string
                unicodeLocaleAttributes:
                  uniqueItems: true
                  type: array
                  items:
                    type: string
                unicodeLocaleKeys:
                  uniqueItems: true
                  type: array
                  items:
                    type: string
                displayLanguage:
                  type: string
                displayScript:
                  type: string
                displayCountry:
                  type: string
                displayVariant:
                  type: string
                extensionKeys:
                  uniqueItems: true
                  type: array
                  items:
                    type: string
                iso3Language:
                  type: string
                iso3Country:
                  type: string
            etag:
              type: string
            pragma:
              type: string
            upgrade:
              type: string
            vary:
              type: array
              items:
                type: string
            accept:
              type: array
              items:
                $ref: "#/components/schemas/MediaType"
            expires:
              type: integer
              format: int64
            ifMatch:
              type: array
              items:
                type: string
            accessControlAllowCredentials:
              type: boolean
            accessControlAllowHeaders:
              type: array
              items:
                type: string
            accessControlAllowMethods:
              type: array
              items:
                $ref: "#/components/schemas/HttpMethod"
            accessControlAllowOrigin:
              type: string
            accessControlExposeHeaders:
              type: array
              items:
                type: string
            accessControlRequestHeaders:
              type: array
              items:
                type: string
            accessControlRequestMethod:
              $ref: "#/components/schemas/HttpMethod"
            acceptLanguage:
              type: array
              items:
                type: object
                properties:
                  range:
                    type: string
                  weight:
                    type: number
                    format: double
            basicAuth:
              type: string
              writeOnly: true
            acceptLanguageAsLocales:
              type: array
              items:
                type: object
                properties:
                  language:
                    type: string
                  displayName:
                    type: string
                  country:
                    type: string
                  variant:
                    type: string
                  script:
                    type: string
                  unicodeLocaleAttributes:
                    uniqueItems: true
                    type: array
                    items:
                      type: string
                  unicodeLocaleKeys:
                    uniqueItems: true
                    type: array
                    items:
                      type: string
                  displayLanguage:
                    type: string
                  displayScript:
                    type: string
                  displayCountry:
                    type: string
                  displayVariant:
                    type: string
                  extensionKeys:
                    uniqueItems: true
                    type: array
                    items:
                      type: string
                  iso3Language:
                    type: string
                  iso3Country:
                    type: string
            acceptPatch:
              type: array
              items:
                $ref: "#/components/schemas/MediaType"
            ifUnmodifiedSince:
              type: integer
              format: int64
            accessControlMaxAge:
              type: integer
              format: int64
            ifNoneMatch:
              type: array
              items:
                type: string
            bearerAuth:
              type: string
              writeOnly: true
          additionalProperties:
            type: array
            items:
              type: string
        typeMessageCode:
          type: string
        titleMessageCode:
          type: string
        detailMessageCode:
          type: string
        detailMessageArguments:
          type: array
          items:
            type: object
    LoanStatementRequestDto:
      required:
      - amount
      - birthdate
      - email
      - firstName
      - lastName
      - middleName
      - passportNumber
      - passportSeries
      - term
      type: object
      properties:
        amount:
          minimum: 20000
          exclusiveMinimum: false
          type: number
        term:
          minimum: 6
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        email:
          pattern: "^[a-z0-9A-Z_!#$%&'*+/=?`{|}~^.-]+@[a-z0-9A-Z.-]+$"
          type: string
        birthdate:
          type: string
          format: date
        passportSeries:
          maxLength: 4
          minLength: 4
          type: string
        passportNumber:
          maxLength: 6
          minLength: 6
          type: string
    LoanOfferDto:
      required:
      - monthlyPayment
      - rate
      - requestedAmount
      - statementId
      - term
      - totalAmount
      type: object
      properties:
        statementId:
          minimum: 1
          type: integer
          format: int64
        requestedAmount:
          minimum: 20000
          exclusiveMinimum: false
          type: number
        totalAmount:
          minimum: 20000
          exclusiveMinimum: false
          type: number
        term:
          minimum: 6
          type: integer
          format: int32
        monthlyPayment:
          minimum: 1
          type: number
        rate:
          minimum: 1
          type: number
        salaryClient:
          type: boolean
        insuranceEnabled:
          type: boolean
    EmploymentDto:
      required:
      - employerINN
      - employmentStatus
      - position
      - salary
      - workExperienceCurrent
      - workExperienceTotal
      type: object
      properties:
        employmentStatus:
          type: string
          enum:
          - EMPLOYED
          - UNEMPLOYED
          - SELF_EMPLOYED
          - BUSINESS_OWNER
        employerINN:
          type: string
        position:
          type: string
          enum:
          - WORKER
          - MID_MANAGER
          - TOP_MANAGER
          - OWNER
        workExperienceTotal:
          minimum: 1
          type: integer
          format: int32
        workExperienceCurrent:
          minimum: 1
          type: integer
          format: int32
        salary:
          minimum: 1.0
          exclusiveMinimum: false
          type: number
    FinishRegistrationRequestDto:
      required:
      - accountNumber
      - dependentAmount
      - employment
      - gender
      - maritalStatus
      - passportIssueBrach
      - passportIssueDate
      type: object
      properties:
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - NON_BINARY
        maritalStatus:
          type: string
          enum:
          - SINGLE
          - MARRIED
          - WIDOW_WIDOWER
          - DIVORCED
        dependentAmount:
          minimum: 20000
          exclusiveMinimum: false
          type: number
        passportIssueDate:
          type: string
          format: date
        passportIssueBrach:
          type: string
        employment:
          $ref: "#/components/schemas/EmploymentDto"
        accountNumber:
          type: string
    Client:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        birthdate:
          type: string
          format: date
        email:
          type: string
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - NON_BINARY
        maritalStatus:
          type: string
          enum:
          - SINGLE
          - MARRIED
          - WIDOW_WIDOWER
          - DIVORCED
        dependentAmount:
          type: integer
          format: int32
        passport:
          $ref: "#/components/schemas/Passport"
        employment:
          $ref: "#/components/schemas/EmploymentDto"
        accountNumber:
          type: string
    Credit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
        term:
          type: integer
          format: int32
        monthlyPayment:
          type: number
        rate:
          type: number
        psk:
          type: number
        paymentSchedule:
          type: array
          items:
            $ref: "#/components/schemas/PaymentScheduleElementDto"
        creditStatus:
          type: string
          enum:
          - CALCULATED
          - ISSUED
        salaryClient:
          type: boolean
        insuranceEnabled:
          type: boolean
    Passport:
      type: object
      properties:
        series:
          type: string
        number:
          type: string
        issueBranch:
          type: string
        issueDate:
          type: string
          format: date
    PaymentScheduleElementDto:
      type: object
      properties:
        number:
          type: integer
          format: int32
        date:
          type: string
          format: date
        totalPayment:
          type: number
        interestPayment:
          type: number
        debtPayment:
          type: number
        remainingDebt:
          type: number
    Statement:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PREAPPROVAL
          - APPROVED
          - CC_DENIED
          - CC_APPROVED
          - PREPARE_DOCUMENTS
          - DOCUMENT_CREATED
          - CLIENT_DENIED
          - DOCUMENT_SIGNED
          - CREDIT_ISSUED
        creationDate:
          type: string
          format: date-time
        signData:
          type: string
          format: date-time
        loanOffer:
          $ref: "#/components/schemas/LoanOfferDto"
        sesCode:
          type: string
        statusHistory:
          type: array
          items:
            $ref: "#/components/schemas/StatementStatusHistoryDto"
        credit:
          $ref: "#/components/schemas/Credit"
        client:
          $ref: "#/components/schemas/Client"
    StatementStatusHistoryDto:
      type: object
      properties:
        status:
          type: string
          enum:
          - PREAPPROVAL
          - APPROVED
          - CC_DENIED
          - CC_APPROVED
          - PREPARE_DOCUMENTS
          - DOCUMENT_CREATED
          - CLIENT_DENIED
          - DOCUMENT_SIGNED
          - CREDIT_ISSUED
        time:
          type: string
          format: date-time
        changeType:
          type: string
          enum:
          - AUTOMATIC
          - MANUAL
