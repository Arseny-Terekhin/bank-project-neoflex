name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
            distribution: 'temurin'
            java-version: '21'
            cache: 'maven'

      - name: Build & Test (generate JaCoCo XML in each module)
        run: mvn -B -U -T1C clean verify

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
              calculator/target/site/jacoco/jacoco.xml
              deal/target/site/jacoco/jacoco.xml
              statement/target/site/jacoco/jacoco.xml
              flags: unittests
              fail_ci_if_error: true

      - name: SonarCloud Scan
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
            mvn org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
              -Dsonar.projectKey=Arseny-Terekhin_bank-project-neoflex \
              -Dsonar.organization=arseny-terekhin \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
              -Dsonar.coverage.jacoco.xmlReportPaths=calculator/target/site/jacoco/jacoco.xml,deal/target/site/jacoco/jacoco.xml,statement/target/site/jacoco/jacoco.xml